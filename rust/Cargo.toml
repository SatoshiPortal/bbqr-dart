[package]
name = "dart_bbqr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0.68"
serde = "1.0.89"
serde_json = "1.0.96"
bbqr = { git = "https://github.com/SatoshiPortal/bbqr-rust.git", rev = "c02a2028616f595a8b6ebc5eef317d5622e4479a", default-features = false }

# static link libz-sys
libz-sys = { version = "1.1", features = ["static"] }
extend = "1.2.0"


[features]
bull_sdk = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# [profile.release]
# strip = true
# opt-level = "z"
# lto = true
# codegen-units = 1
# panic = "abort"
